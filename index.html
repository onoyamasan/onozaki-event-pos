<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イベントレジ">
<meta name="theme-color" content="#1B4F72">
<title>おのざき イベントレジ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #FAFBFD; color: #333; overscroll-behavior: none;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; padding: 14px 22px; font-size: 15px; font-weight: bold;
    transition: transform .1s, opacity .1s; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .45; }
  .btn-primary { background: linear-gradient(135deg,#1B4F72,#143D57); color: #fff; box-shadow: 0 4px 12px rgba(27,79,114,.3); }
  .btn-accent  { background: linear-gradient(135deg,#D4573B,#B8432D); color: #fff; box-shadow: 0 4px 12px rgba(212,87,59,.3); }
  .btn-light   { background: #fff; color: #555; border: 2px solid #E5E7EB; }
  .btn-sm { padding: 8px 14px; font-size: 13px; }
  .card { background: #fff; border: 2px solid #E8EFF5; border-radius: 14px; padding: 16px; }
  .muted { color: #888; font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .field { width: 100%; padding: 12px; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 15px; background: #fff; }
  .tag { display: inline-block; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 6px; }
  .tag-kintone { background: #E8EFF5; color: #1B4F72; }
  .tag-local { background: #FFF4E5; color: #A85E00; }

  #hdr { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: #1B4F72; color: #fff; position: sticky; top: 0; z-index: 100; }
  #hdr-title { font-weight: bold; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip-off { background: #FDE8E2; color: #B8432D; }
  .chip-on  { background: #E8F5E9; color: #1B5E20; }
  .chip-pending { background: #FFF4E5; color: #A85E00; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }
  .wrap { max-width: 680px; margin: 0 auto; }
  .h1 { font-size: 19px; font-weight: bold; color: #1B4F72; margin-bottom: 6px; }

  #reg-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { #reg-layout { grid-template-columns: 1fr; } }
  #prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
  .prod { background: #fff; border: 2px solid #E5E7EB; border-radius: 14px; padding: 16px 10px; text-align: center; min-height: 92px; }
  .prod:active { border-color: #D4573B; transform: scale(0.96); }
  .prod-name { font-weight: bold; font-size: 15px; color: #1B4F72; line-height: 1.3; margin-bottom: 6px; }
  .prod-price { font-size: 17px; font-weight: bold; color: #D4573B; }
  .prod-sold { font-size: 11px; color: #888; margin-top: 4px; }

  #cart-panel { position: sticky; top: 60px; }
  .cart-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .cart-name { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qbtn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid #E5E7EB; background: #fff; font-size: 17px; font-weight: bold; color: #666; line-height: 1; }
  .kpi { background: #fff; border: 2px solid #E8EFF5; border-radius: 12px; padding: 10px 12px; }
  .kpi-label { font-size: 11px; color: #888; font-weight: bold; }
  .kpi-value { font-size: 19px; font-weight: bold; color: #1B4F72; }
  .track { height: 10px; background: #E8EFF5; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg,#1B4F72,#4A90C2); border-radius: 999px; transition: width .3s; }

  #pay { display: none; padding: 16px; }
  #keypad { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  #keypad .btn { padding: 22px 0; font-size: 24px; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1B4F72; color: #fff; padding: 13px 24px; border-radius: 12px; font-weight: bold;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    z-index: 600; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: #B8432D; }

  #ov { display: none; position: fixed; inset: 0; background: rgba(20,40,60,.55); z-index: 500;
    align-items: center; justify-content: center; padding: 20px; }
  #ov.open { display: flex; }
  #ov-box { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden; }
  #ov-head { padding: 16px 18px; border-bottom: 2px solid #E8EFF5; font-weight: bold; color: #1B4F72; font-size: 16px; }
  #ov-body { padding: 16px 18px; overflow-y: auto; }
  #ov-foot { padding: 14px 18px; border-top: 1px solid #eee; display: flex; gap: 10px; justify-content: flex-end; }

  .row { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid #eee; }
  .row:last-child { border-bottom: none; }
  .pickable { width: 100%; background: #fff; border: none; text-align: left; }
  .pickable:active { background: #F3F8FC; }
  .menu-item { display: flex; align-items: center; justify-content: space-between; width: 100%;
    padding: 18px 16px; background: #fff; border: none; border-bottom: 1px solid #eee;
    font-size: 16px; font-weight: bold; color: #1B4F72; text-align: left; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .sub { font-size: 12px; color: #888; font-weight: normal; }
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-title">おのざき イベントレジ</div>
  <span id="chip-pending" class="chip chip-pending" style="display:none;"></span>
  <span id="chip-net" class="chip chip-off"><span class="dot"></span><span id="chip-net-t">オフライン</span></span>
  <button id="btn-menu" class="btn btn-light btn-sm">メニュー</button>
</div>

<!-- 端末セットアップ -->
<div id="s-setup" class="screen">
  <div class="card" style="max-width:520px;margin:40px auto;">
    <div class="h1">端末セットアップ</div>
    <div class="muted" style="margin:8px 0 16px;line-height:1.7;">
      <b>接続コード</b>を貼り付けてください。この端末に一度だけ保存されます。<br>
      <b style="color:#1B5E20;">電波が無くても登録できます。</b>
    </div>
    <textarea id="setup-code" rows="4" placeholder="接続コードを貼り付け" class="field" style="font-family:monospace;font-size:14px;"></textarea>
    <button id="setup-go" class="btn btn-primary" style="width:100%;margin-top:14px;">この端末を登録する</button>
    <div class="muted" style="margin-top:14px;line-height:1.7;border-top:1px solid #eee;padding-top:14px;">
      接続コードが手元に無いときは、登録済みのアプリの<br>
      ［メニュー］→［接続コードを表示］からコピーできます。
    </div>
    <div id="setup-msg" class="muted" style="margin-top:12px;text-align:center;min-height:20px;"></div>
  </div>
</div>

<!-- イベント一覧 -->
<div id="s-events" class="screen">
  <div class="wrap">
    <div class="h1">イベントを選ぶ</div>
    <div class="muted" style="margin-bottom:14px;line-height:1.7;">
      レジを開くイベントを選んでください。<b>電波が無くても、ここまでは動きます。</b>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;">
      <button id="ev-pull" class="btn btn-primary">kintoneから取り込む</button>
      <button id="ev-new" class="btn btn-light">この場で作る</button>
    </div>
    <button id="ev-import" class="btn btn-light" style="width:100%;margin-bottom:16px;font-size:14px;padding:11px;">コードからイベントを復元（圏外でも可）</button>
    <div id="ev-pull-note" class="muted" style="margin-bottom:14px;line-height:1.7;"></div>
    <div class="card" style="padding:0;"><div id="ev-list"></div></div>
  </div>
</div>

<!-- レジ -->
<div id="s-reg" class="screen">
  <div id="reg-layout">
    <div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;">
        <div style="font-size:13px;font-weight:bold;color:#1B4F72;">商品（タップでカートに追加）</div>
        <button id="reg-edit-prod" class="btn btn-light btn-sm">商品を編集</button>
      </div>
      <div id="prod-grid"></div>
    </div>
    <div id="cart-panel">
      <div class="card" style="background:#FAFBFD;">
        <div style="font-weight:bold;color:#1B4F72;margin-bottom:8px;">現在のお会計</div>
        <div id="cart-list"></div>
        <div id="cart-total" style="text-align:right;margin-top:10px;padding-top:10px;border-top:2px solid #E8EFF5;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
          <button id="pay-cash" class="btn btn-primary" style="padding:16px 8px;">現金で会計</button>
          <button id="pay-paypay" class="btn btn-accent" style="padding:16px 8px;">PayPayで会計</button>
        </div>
      </div>
      <div id="reg-totals" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<!-- 会計 -->
<div id="pay"></div>

<!-- 商品編集（イベントごと） -->
<div id="s-prod" class="screen">
  <div class="wrap">
    <div class="h1">商品の登録</div>
    <div id="prod-ev" class="muted" style="margin-bottom:14px;line-height:1.7;"></div>
    <div class="card" style="margin-bottom:14px;">
      <div style="display:grid;grid-template-columns:1fr 110px 92px;gap:10px;align-items:end;">
        <div><div class="muted" style="margin-bottom:5px;">商品名</div>
          <input id="np-name" class="field" type="text" placeholder="例）海鮮丼"></div>
        <div><div class="muted" style="margin-bottom:5px;">売価（税込）</div>
          <input id="np-price" class="field num" type="number" inputmode="numeric" min="0" placeholder="1200"></div>
        <div><div class="muted" style="margin-bottom:5px;">税率</div>
          <select id="np-tax" class="field"><option value="8%">8%</option><option value="10%">10%</option></select></div>
      </div>
      <button id="np-add" class="btn btn-primary" style="width:100%;margin-top:12px;">この商品を追加</button>
      <div class="muted" style="margin-top:10px;line-height:1.6;">
        税率は、飲食料品の持ち帰りが 8%、店内飲食・酒類・非food が 10% です。
      </div>
    </div>
    <button id="np-copy" class="btn btn-light" style="width:100%;margin-bottom:14px;">別のイベントから商品をコピー</button>
    <div class="card" style="padding:0;"><div id="prod-list"></div></div>
    <button id="prod-done" class="btn btn-primary" style="width:100%;margin-top:16px;">レジに戻る</button>
  </div>
</div>

<!-- 送信 -->
<div id="s-send" class="screen">
  <div class="wrap">
    <div class="h1">kintone に送信</div>
    <div id="send-body" style="margin-top:14px;"></div>
  </div>
</div>

<!-- メニュー -->
<div id="s-menu" class="screen">
  <div class="wrap">
    <div class="card" style="padding:0;margin-bottom:16px;">
      <button id="m-send" class="menu-item"><span>kintone に送信</span><span id="m-send-sub" class="sub"></span></button>
      <button id="m-events" class="menu-item"><span>イベントを選ぶ</span><span id="m-events-sub" class="sub"></span></button>
      <button id="m-prod" class="menu-item"><span>商品の登録・編集</span><span id="m-prod-sub" class="sub"></span></button>
      <button id="m-evcode" class="menu-item"><span>このイベントの持ち出しコード</span><span class="sub">メモに控える ›</span></button>
      <button id="m-reg" class="menu-item"><span>レジに戻る</span><span class="sub">›</span></button>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div style="font-weight:bold;color:#1B4F72;margin-bottom:10px;">本日の会計履歴</div>
      <div id="menu-history" style="max-height:40vh;overflow-y:auto;"></div>
    </div>
    <div class="card">
      <div style="font-weight:bold;color:#1B4F72;margin-bottom:10px;">この端末</div>
      <div id="menu-device" class="muted" style="line-height:1.8;margin-bottom:12px;"></div>
      <button id="menu-code" class="btn btn-light" style="width:100%;margin-bottom:8px;">接続コードを表示</button>
      <button id="menu-reset" class="btn btn-light" style="width:100%;color:#B8432D;border-color:#F3C9BE;">端末登録を解除</button>
    </div>
  </div>
</div>

<!-- 共通オーバーレイ -->
<div id="ov"><div id="ov-box">
  <div id="ov-head"></div><div id="ov-body"></div>
  <div id="ov-foot">
    <button id="ov-cancel" class="btn btn-light">キャンセル</button>
    <button id="ov-ok" class="btn btn-primary">OK</button>
  </div>
</div></div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
