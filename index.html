<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イベントレジ">
<meta name="theme-color" content="#1B4F72">
<title>おのざき イベントレジ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #FAFBFD; color: #333;
    overscroll-behavior: none;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button { font-family: inherit; cursor: pointer; }

  /* ── 共通パーツ ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 12px; padding: 14px 22px;
    font-size: 15px; font-weight: bold; transition: transform .1s, opacity .1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .45; }
  .btn-primary { background: linear-gradient(135deg,#1B4F72,#143D57); color: #fff; box-shadow: 0 4px 12px rgba(27,79,114,.3); }
  .btn-accent  { background: linear-gradient(135deg,#D4573B,#B8432D); color: #fff; box-shadow: 0 4px 12px rgba(212,87,59,.3); }
  .btn-light   { background: #fff; color: #555; border: 2px solid #E5E7EB; }
  .card { background: #fff; border: 2px solid #E8EFF5; border-radius: 14px; padding: 16px; }
  .muted { color: #888; font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ── ヘッダー ── */
  #hdr {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: #1B4F72; color: #fff;
    position: sticky; top: 0; z-index: 100;
  }
  #hdr-title { font-weight: bold; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip {
    font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
  }
  .chip-off { background: #FDE8E2; color: #B8432D; }
  .chip-on  { background: #E8F5E9; color: #1B5E20; }
  .chip-pending { background: #FFF4E5; color: #A85E00; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

  /* ── 画面 ── */
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }

  /* ── レジ ── */
  #reg-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { #reg-layout { grid-template-columns: 1fr; } }
  #prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 12px; }
  .prod {
    background: #fff; border: 2px solid #E5E7EB; border-radius: 14px;
    padding: 16px 10px; text-align: center; min-height: 96px;
  }
  .prod:active { border-color: #D4573B; transform: scale(0.96); }
  .prod-name { font-weight: bold; font-size: 15px; color: #1B4F72; line-height: 1.3; margin-bottom: 6px; }
  .prod-price { font-size: 16px; font-weight: bold; color: #D4573B; }
  .prod-qty { font-size: 11px; color: #888; margin-top: 5px; }

  #cart-panel { position: sticky; top: 60px; }
  .cart-row { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .cart-name { flex: 1; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qbtn { width: 32px; height: 32px; border-radius: 8px; border: 2px solid #E5E7EB; background: #fff; font-size: 17px; font-weight: bold; color: #666; line-height: 1; }
  .kpi { background: #fff; border: 2px solid #E8EFF5; border-radius: 12px; padding: 10px 12px; }
  .kpi-label { font-size: 11px; color: #888; font-weight: bold; }
  .kpi-value { font-size: 19px; font-weight: bold; color: #1B4F72; }
  .track { height: 10px; background: #E8EFF5; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: linear-gradient(90deg,#1B4F72,#4A90C2); border-radius: 999px; transition: width .3s; }

  /* ── 会計画面 ── */
  #pay { display: none; padding: 16px; }
  #keypad { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
  #keypad .btn { padding: 22px 0; font-size: 24px; }

  /* ── トースト ── */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: #1B4F72; color: #fff; padding: 13px 24px; border-radius: 12px;
    font-weight: bold; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 500; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: #B8432D; }

  .ev-row { display: flex; align-items: center; gap: 12px; padding: 14px; border-bottom: 1px solid #eee; }
  .ev-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="hdr">
  <div id="hdr-title">おのざき イベントレジ</div>
  <span id="chip-net" class="chip chip-off"><span class="dot"></span><span id="chip-net-t">オフライン</span></span>
  <span id="chip-pending" class="chip chip-pending" style="display:none;"></span>
  <button id="btn-menu" class="btn btn-light" style="padding:8px 14px;font-size:13px;">メニュー</button>
</div>

<!-- ① 初回セットアップ -->
<div id="s-setup" class="screen">
  <div class="card" style="max-width:520px;margin:40px auto;">
    <div style="font-size:19px;font-weight:bold;color:#1B4F72;margin-bottom:6px;">端末セットアップ</div>
    <div class="muted" style="margin-bottom:20px;line-height:1.7;">
      kintoneの「イベント管理」画面に表示される<b>接続コード</b>を貼り付けてください。<br>
      この端末に一度だけ保存され、次回からは不要です。
    </div>
    <textarea id="setup-code" rows="4" placeholder="接続コードを貼り付け"
      style="width:100%;padding:12px;border:2px solid #E5E7EB;border-radius:10px;font-size:14px;font-family:monospace;"></textarea>
    <button id="setup-go" class="btn btn-primary" style="width:100%;margin-top:14px;">この端末を登録する</button>
    <div id="setup-msg" class="muted" style="margin-top:12px;text-align:center;min-height:20px;"></div>
  </div>
</div>

<!-- ② イベント選択 -->
<div id="s-events" class="screen">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
    <div style="font-size:18px;font-weight:bold;color:#1B4F72;">イベントを選ぶ</div>
    <button id="ev-pull" class="btn btn-primary" style="padding:10px 18px;font-size:14px;">kintoneから取り込む</button>
  </div>
  <div class="muted" style="margin-bottom:14px;line-height:1.7;">
    電波のあるところで「kintoneから取り込む」を押すと、商品と目標がこの端末に保存されます。<br>
    <b>一度取り込めば、会場が圏外でもレジを打てます。</b>
  </div>
  <div id="ev-list" class="card" style="padding:0;"></div>
</div>

<!-- ③ レジ -->
<div id="s-reg" class="screen">
  <div id="reg-layout">
    <div>
      <div style="font-size:13px;font-weight:bold;color:#1B4F72;margin-bottom:10px;">商品（タップでカートに追加）</div>
      <div id="prod-grid"></div>
    </div>
    <div id="cart-panel">
      <div class="card" style="background:#FAFBFD;">
        <div style="font-weight:bold;color:#1B4F72;margin-bottom:8px;">現在のお会計</div>
        <div id="cart-list"></div>
        <div id="cart-total" style="text-align:right;margin-top:10px;padding-top:10px;border-top:2px solid #E8EFF5;"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;">
          <button id="pay-cash" class="btn btn-primary" style="padding:16px 8px;">現金で会計</button>
          <button id="pay-paypay" class="btn btn-accent" style="padding:16px 8px;">PayPayで会計</button>
        </div>
      </div>
      <div id="reg-totals" style="margin-top:14px;"></div>
    </div>
  </div>
</div>

<!-- ④ 会計（現金テンキー / PayPay確認） -->
<div id="pay"></div>

<!-- ⑤ メニュー -->
<div id="s-menu" class="screen">
  <div style="max-width:560px;margin:0 auto;">
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:bold;color:#1B4F72;margin-bottom:12px;">同期</div>
      <div id="menu-sync-state" class="muted" style="margin-bottom:12px;line-height:1.7;"></div>
      <button id="menu-sync" class="btn btn-primary" style="width:100%;">今すぐ kintone に送信</button>
    </div>
    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:bold;color:#1B4F72;margin-bottom:12px;">本日の会計履歴</div>
      <div id="menu-history" style="max-height:44vh;overflow-y:auto;"></div>
    </div>
    <div class="card">
      <div style="font-weight:bold;color:#1B4F72;margin-bottom:12px;">この端末</div>
      <div id="menu-device" class="muted" style="line-height:1.8;margin-bottom:12px;"></div>
      <button id="menu-events" class="btn btn-light" style="width:100%;margin-bottom:8px;">イベントを選び直す</button>
      <button id="menu-reset" class="btn btn-light" style="width:100%;color:#B8432D;border-color:#F3C9BE;">端末登録を解除</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
